version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: monanur-filebrowser-quantum_server_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  server:
    image: gtstef/filebrowser:1.5.6-stable
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m

    volumes:
      - ${APP_DATA_DIR}/data:/home/filebrowser/data
      - ${APP_DATA_DIR}/tmp:/home/filebrowser/tmp
      - ${UMBREL_ROOT}/home:/srv
      - ${APP_DIR}/config.yaml:/home/filebrowser/data/config.yaml:ro

    environment:
      - TZ=Europe/Berlin
      - FILEBROWSER_CONFIG=/home/filebrowser/data/config.yaml
