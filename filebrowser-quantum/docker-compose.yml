version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: filebrowser-quantum_server_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  server:
    image: gtstef/filebrowser:1.5.6-stable
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m

    volumes:
      - ${APP_DATA_DIR}/data:/home/filebrowser/data
      - ${UMBREL_ROOT}/home:/srv

    environment:
      - TZ=Europe/Berlin

    container_name: filebrowser-quantum_server_1
